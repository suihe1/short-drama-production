<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src file: data:; media-src file:; connect-src 'none'">
<title>短剧故事板</title>
<style>
:root{--paper:#edf2f6;--ink:#203344;--muted:#536a7b;--line:#bfced9;--blue:#315d86;--white:#fff;--mark:#b17a31}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 'Microsoft YaHei',sans-serif}header,main{max-width:1500px;margin:auto;padding:24px}header{border-bottom:1px solid var(--line)}h1{font:32px/1.25 Georgia,'SimSun',serif;margin:4px 0 12px}small,.muted{color:var(--muted)}button,select,input,textarea{font:inherit;color:inherit;background:var(--white);border:1px solid var(--line);border-radius:5px;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mark)}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.strip{display:flex;overflow:auto;gap:3px;padding:6px 0 15px}.strip button{min-width:90px;border-bottom:4px solid var(--blue);text-align:left;font:12px/1.5 Consolas,monospace}.strip button.active{background:var(--blue);color:white}.card{background:var(--white);padding:20px;border:1px solid var(--line);margin:0 0 20px;scroll-margin:18px}.card.active{border:2px solid var(--blue)}h2{margin:0;font:21px/1.4 Consolas,'Microsoft YaHei',sans-serif}h3{font-size:14px;margin:0 0 8px}.meta{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0}.panels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}figure{margin:0}img,video{width:100%;max-height:320px;object-fit:contain;background:#dce5ec;display:block}.placeholder{min-height:145px;background:#e6edf2;display:grid;place-content:center;text-align:center;padding:20px;color:var(--muted)}figcaption{font-size:12px;color:var(--muted);margin:6px 0}.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.refs img{height:100px}.detail{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.note{width:100%;min-height:70px;margin-top:10px}#message{min-height:24px}#clock{font-family:Consolas,monospace}.empty{padding:50px;text-align:center}@media(max-width:800px){.panels{grid-template-columns:1fr}header,main{padding:16px}h1{font-size:25px}}
</style>
<header><small>SHORT DRAMA / 镜头审阅</small><h1 id="title"></h1><div id="summary"></div><div class="toolbar"><label>集数 <select id="episode"><option value="">全部</option></select></label><label>查找 <input id="search" placeholder="段号、场景、动作"></label><button id="play">节奏预览</button><span id="clock" aria-live="off"></span><button id="export">导出返工笔记</button></div><small>按规划时长浏览镜头；规划图不自动加入生成参考。笔记暂存在本页内存，关闭前请导出；导出不会改变审批或重新提交任务。</small><div id="message" role="status"></div><nav id="strip" class="strip" aria-label="镜头时间带"></nav></header><main id="cards"></main>
<script>
const data=/*STORYBOARD_DATA*/null;
const $=id=>document.getElementById(id), notes=new Map();let visible=[],timer=null,playing=false,active=-1;
const text=v=>typeof v==='object'&&v!==null?JSON.stringify(v,null,2):String(v??'未填写');
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=text(value);if(cls)n.className=cls;return n}
function picture(url,label){const f=el('figure');if(url){const img=el('img');img.src=url;img.alt=label;img.loading='lazy';img.onerror=()=>img.replaceWith(el('div','图片无法读取，请重新生成报告或检查素材路径','placeholder'));f.append(img)}else f.append(el('div','尚无本地图片','placeholder'));f.append(el('figcaption',label));return f}
function refsPanel(refs){const grid=el('div',undefined,'refs');for(const r of refs){const f=r.role==='reference_image'||/frame|image/i.test(r.role||'')?picture(r.url,`${r.role} · ${r.purpose}`):el('div',`${r.role} · ${r.purpose}（非图片参考）`);grid.append(f)}if(!refs.length)grid.append(el('div','未绑定参考素材','placeholder'));return grid}
function stop(){clearTimeout(timer);timer=null;playing=false;$('play').textContent='节奏预览'}
function focus(i){active=i;document.querySelectorAll('.active').forEach(n=>n.classList.remove('active'));const card=$('shot-'+i),tab=$('tab-'+i);card?.classList.add('active');tab?.classList.add('active');card?.scrollIntoView({block:'start',behavior:'auto'});if(visible[i])$('clock').textContent=`${visible[i].id} · ${visible[i].duration}s`}
function tick(i){if(i>=visible.length){stop();$('clock').textContent='预览结束';return}focus(i);timer=setTimeout(()=>tick(i+1),visible[i].duration*1000)}
function render(){stop();active=-1;$('cards').replaceChildren();$('strip').replaceChildren();const query=$('search').value.toLowerCase();visible=data.shots.filter(s=>(!$('episode').value||String(s.episode)===$('episode').value)&&text([s.segment,s.scene,s.action,s.id]).toLowerCase().includes(query));$('summary').textContent=`${data.aspect} / ${visible.length} 镜 / ${visible.reduce((a,s)=>a+s.duration,0).toFixed(1)} 秒`;
 visible.forEach((s,i)=>{const tab=el('button',`${s.id}\n${s.duration}s`);tab.id='tab-'+i;tab.style.flexGrow=s.duration;tab.onclick=()=>{stop();focus(i)};$('strip').append(tab);const card=el('article',undefined,'card');card.id='shot-'+i;card.append(el('h2',s.id),el('small',`E${s.episode} · ${s.segment} · 场景 ${s.scene} · 段内 ${s.start.toFixed(1)}–${(s.start+s.duration).toFixed(1)}s`));card.append(el('div',`景别 ${s.size||'未填写'} / 角度 ${s.angle||'未填写'}`,'meta'));const panels=el('div',undefined,'panels');const plan=el('section');plan.append(el('h3','构图规划 · 仅供审阅'),picture(s.image,'规划图，不自动提交给模型'));const reference=el('section');reference.append(el('h3','参考素材'));const output=el('section');output.append(el('h3','生成结果 · 整段视频'));
 function variant(v){reference.replaceChildren(el('h3',v?'任务实际绑定参考':'分镜计划参考 · 尚无任务'));reference.append(refsPanel(v?v.refs:s.plannedRefs));output.querySelectorAll('video,.placeholder,.variant-status').forEach(n=>n.remove());output.append(el('div',v?`${v.id} / ${v.status}`:'尚未生成','variant-status'));if(v?.video){const video=el('video');video.src=v.video;video.controls=true;video.preload='none';video.onerror=()=>video.replaceWith(el('div','视频无法读取，请检查本地路径','placeholder'));output.append(video)}else output.append(el('div','暂无本地视频；本页不会调用生成接口','placeholder'))}
 if(s.variants.length){const select=el('select');select.setAttribute('aria-label',`${s.id} 生成版本`);s.variants.forEach((v,k)=>{const o=el('option',v.id);o.value=k;select.append(o)});select.onchange=()=>variant(s.variants[Number(select.value)]);output.append(select)}variant(s.variants[0]);panels.append(plan,reference,output);card.append(panels);for(const [label,val] of [['叙事目的',s.purpose],['人物动作',s.action],['摄影机运动',s.camera],['连续性',s.continuity]]){const d=el('details');d.append(el('summary',label),el('div',text(val),'detail'));card.append(d)}const note=el('textarea',undefined,'note');note.setAttribute('aria-label',`${s.id} 返工笔记`);note.placeholder='记录姿态、手别、屏幕方向、信息可读性或节奏问题…';note.value=notes.get(s.key)||'';note.oninput=()=>notes.set(s.key,note.value);card.append(note);$('cards').append(card)});if(!visible.length)$('cards').append(el('div','没有匹配镜头，请调整筛选条件。','empty'))}
$('title').textContent=data.title;for(const ep of [...new Set(data.shots.map(s=>s.episode))]){const o=el('option',`第 ${ep} 集`);o.value=ep;$('episode').append(o)}$('episode').onchange=render;$('search').oninput=render;$('play').onclick=()=>{if(playing){stop();return}if(!visible.length)return;playing=true;$('play').textContent='停止预览';tick(0)};$('export').onclick=()=>{const entries=data.shots.filter(s=>notes.get(s.key)?.trim()).map(s=>({key:s.key,shotId:s.id,episode:s.episode,segment:s.segment,note:notes.get(s.key)}));const blob=new Blob([JSON.stringify({schemaVersion:'1.0',type:'storyboard-review-notes',title:data.title,createdAt:new Date().toISOString(),entries},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='storyboard-review-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent=`已导出 ${entries.length} 条笔记，项目审批状态未改变。`};window.addEventListener('beforeunload',e=>{if([...notes.values()].some(v=>v.trim())){e.preventDefault();e.returnValue=''}});render();
/*SHEET_EXPORT_CODE*/
</script></html>
