name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: node scripts/selftest.mjs
      - run: node scripts/reality-gate-test.mjs
      - run: node scripts/storyboard-view-test.mjs
      - run: node scripts/review-handoff-test.mjs
      - run: node scripts/post-workflow-test.mjs
      - run: node scripts/bundle-test.mjs
      - run: node skills/short-drama-director/scripts/format-handoff-test.mjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate-skills.py
      - run: python scripts/compshare-offline-test.py
      - run: node scripts/offline-demo.mjs
      - run: node scripts/storyboard-view.mjs examples/offline/storyboard.json --out runs/storyboard-demo.html
  browser-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/sheet-export-browser-test.mjs
